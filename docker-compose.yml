services:
  gateway:
    build: .
    image: open-ai-api:local
    ports:
      - "18080:18080"
    environment:
      SERVER_ADDRESS: "0.0.0.0"
      SERVER_PORT: "18080"
      TRANSPORT_KEY: ${TRANSPORT_KEY:-dev-shared-transport-key}
      UPSTREAM_BASE_URL: ${UPSTREAM_BASE_URL:-http://host.docker.internal:8094}
      UPSTREAM_PAGE_URL: ${UPSTREAM_PAGE_URL:-http://host.docker.internal:8094/}
      UPSTREAM_HEADLESS: ${UPSTREAM_HEADLESS:-true}
      UPSTREAM_BROWSERS_PATH: /ms-playwright
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
